{% extends "base.html" %}
{% block conteudo %}
<h1>Nova senha</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ token_csrf() }}">
  <label>Nova senha <input name="senha" type="password" required minlength="8" autocomplete="new-password"></label>
  <small>Mínimo 8 caracteres, com maiúscula, minúscula, número e símbolo.</small>
  <label>Confirmar senha <input name="confirmar" type="password" required autocomplete="new-password"></label>
  <button type="submit">Salvar nova senha</button>
</form>
{% endblock %}
