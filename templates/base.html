<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Seguro</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #eef1f5; margin: 0;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .caixa { background: #fff; padding: 2rem; border-radius: 10px; width: 100%; max-width: 380px;
             box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.4rem; color: #1f2937; }
    label { display: block; margin-top: .8rem; font-size: .9rem; color: #374151; }
    input { width: 100%; padding: .6rem; margin-top: .3rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { width: 100%; margin-top: 1.2rem; padding: .7rem; border: 0; border-radius: 6px;
             background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .aviso { background: #fef3c7; color: #92400e; padding: .6rem; border-radius: 6px; margin-bottom: .6rem; font-size: .9rem; }
    .links { margin-top: 1rem; font-size: .9rem; text-align: center; }
    .links a { color: #2563eb; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <div class="caixa">
    {% with mensagens = get_flashed_messages() %}
      {% for m in mensagens %}<div class="aviso">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
