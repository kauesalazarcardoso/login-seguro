{% extends "base.html" %}
{% block conteudo %}
<h1>Entrar</h1>
<form method="post">
  <input type="hidden" name="csrf" value="{{ token_csrf() }}">
  <label>Usuário <input name="usuario" required autocomplete="username"></label>
  <label>Senha <input name="senha" type="password" required autocomplete="current-password"></label>
  <button type="submit">Entrar</button>
</form>
<div class="links">
  <a href="{{ url_for('cadastro') }}">Criar conta</a> ·
  <a href="{{ url_for('esqueci_senha') }}">Esqueci minha senha</a>
</div>
{% endblock %}
